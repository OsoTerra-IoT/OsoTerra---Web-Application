<div class="auth-page">
  <aside class="auth-story">
    <a class="brand" routerLink="/auth/login"
      ><img
        class="brand-symbol"
        src="brand/ososense-symbol-white.png"
        alt=""
        width="40"
        height="40"
      />{{ 'brand.name' | translate }}</a
    >
    <div>
      <p class="eyebrow">{{ 'brand.caption' | translate }}</p>
      <h1>{{ 'auth.headline' | translate }}</h1>
      <p>{{ 'auth.description' | translate }}</p>
      <div class="soil-lines" aria-hidden="true"></div>
    </div>
    <p>{{ 'brand.footer' | translate }}</p>
  </aside>
  <section class="auth-panel">
    <div class="auth-language"><app-language-switcher /></div>
    <div class="auth-form"><ng-content /></div>
  </section>
</div>
