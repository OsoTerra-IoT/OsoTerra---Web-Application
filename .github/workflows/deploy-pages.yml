name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npx ng build --base-href /${{ github.event.repository.name }}/
      # SPA fallback: GitHub Pages serves 404.html for deep links, which boots the Angular router
      - run: |
          cp dist/osoterra-web-app/browser/index.html dist/osoterra-web-app/browser/404.html
          touch dist/osoterra-web-app/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/osoterra-web-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
